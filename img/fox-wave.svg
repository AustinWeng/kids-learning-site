  <path d="M 148 200 C 182 206, 214 190, 220 160 C 224 140, 214 120, 200 112 C 204 132, 196 152, 178 164 C 166 172, 154 178, 146 182 Z" fill="none" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
