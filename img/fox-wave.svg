  <circle cx="92" cy="92" r="9" fill="#342A23"/>
  <circle cx="89" cy="89" r="3.2" fill="#FFFFFF"/>
  <circle cx="148" cy="92" r="9" fill="#342A23"/>
  <circle cx="145" cy="89" r="3.2" fill="#FFFFFF"/>
  <ellipse cx="76" cy="112" rx="7.5" ry="6" fill="#FF9E8E"/>
  <ellipse cx="164" cy="112" rx="7.5" ry="6" fill="#FF9E8E"/>
  <!-- 青綠色圍巾 -->
  <path d="M 136 156 L 154 152 L 160 184 L 142 188 Z" fill="#12898C" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 141 179 L 158 175" fill="none" stroke="#7FD1D2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 78 136 C 92 146, 148 146, 162 136 C 168 140, 168 150, 162 154 C 146 168, 94 168, 78 154 C 72 150, 72 140, 78 136 Z" fill="#12898C"/>
  <path d="M 78 154 C 94 168, 146 168, 162 154 C 146 162, 94 162, 78 154 Z" fill="#0B6467"/>
  <path d="M 78 136 C 92 146, 148 146, 162 136 C 168 140, 168 150, 162 154 C 146 168, 94 168, 78 154 C 72 150, 72 140, 78 136 Z" fill="none" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
