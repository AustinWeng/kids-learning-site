  <ellipse cx="136" cy="219" rx="15" ry="7" fill="#6B3E26" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 字卡「A」 -->
  <g transform="translate(78 186) rotate(-14)">
    <rect x="-20" y="-24" width="40" height="46" rx="8" fill="#12898C" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -10 12 L 0 -14 L 10 12 M -6 3 L 6 3" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
