  <path d="M 86 158 C 76 168, 76 190, 88 198 C 98 201, 103 193, 97 187 C 91 181, 90 168, 93 160 Z" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 鉛筆 -->
  <g transform="translate(72 178) rotate(-35)">
    <path d="M -6 -34 L 6 -34 L 6 14 L -6 14 Z" fill="#7E57C2" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -6 -34 L 6 -34 L 6 -42 C 6 -46, -6 -46, -6 -42 Z" fill="#F7B9A0" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -6 14 L 6 14 L 0 28 Z" fill="#F4D3A8" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -2.2 23 L 2.2 23 L 0 28 Z" fill="#4A342A" stroke="#4A342A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 0 -30 L 0 10" fill="none" stroke="#B79BE0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 握住鉛筆的手指 -->
  <ellipse cx="90" cy="192" rx="9" ry="8" fill="#F6EEE6" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 頭 -->
  <ellipse cx="120" cy="96" rx="58" ry="52" fill="#F6EEE6"/>
  <path d="M 172 74 C 182 94, 176 118, 158 132 C 142 144, 118 148, 96 140 Q 170 140, 172 74 Z" fill="#DCCBBE"/>
  <ellipse cx="120" cy="116" rx="26" ry="17" fill="#FFFFFF"/>
  <path d="M 78 74 C 84 60, 96 52, 108 49" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="120" cy="96" rx="58" ry="52" fill="none" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 圍巾 -->
  <path d="M 138 158 L 156 154 L 162 186 L 144 190 Z" fill="#7E57C2" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 143 181 L 160 177" fill="none" stroke="#B79BE0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 76 136 C 90 146, 150 146, 164 136 C 170 140, 170 150, 164 154 C 148 170, 92 170, 76 154 C 70 150, 70 140, 76 136 Z" fill="#7E57C2"/>
  <path d="M 76 154 C 92 170, 148 170, 164 154 C 148 163, 92 163, 76 154 Z" fill="#5E3A9A"/>
  <path d="M 76 136 C 90 146, 150 146, 164 136 C 170 140, 170 150, 164 154 C 148 170, 92 170, 76 154 C 70 150, 70 140, 76 136 Z" fill="none" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 鼻子與嘴（門牙） -->
  <path d="M 115.5 114 L 115.5 120 L 124.5 120 L 124.5 114" fill="#FFFFFF" stroke="#4A342A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 110 112 Q 115 119, 120 112 Q 125 119, 130 112" fill="none" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 114 104 Q 120 100, 126 104 Q 124 110, 120 110 Q 116 110, 114 104 Z" fill="#E8798A" stroke="#4A342A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 眼睛與腮紅 -->
  <circle cx="92" cy="90" r="9" fill="#342A23"/>
  <circle cx="89" cy="87" r="3.2" fill="#FFFFFF"/>
  <circle cx="148" cy="90" r="9" fill="#342A23"/>
  <circle cx="145" cy="87" r="3.2" fill="#FFFFFF"/>
  <ellipse cx="82" cy="110" rx="7.5" ry="6.5" fill="#FF9E8E"/>
  <ellipse cx="158" cy="110" rx="7.5" ry="6.5" fill="#FF9E8E"/>
</svg>
