<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 兔子「跳跳」：語詞模組角色，正面站姿揮手，拿著一枝鉛筆 -->

  <!-- 長耳朵（頭後） -->
  <path d="M 94 60 C 78 38, 74 4, 92 2 C 110 2, 114 34, 110 58 Z" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 98 50 C 88 36, 86 16, 93 13 C 101 14, 103 34, 103 50 Z" fill="#F7B9A0"/>
  <path d="M 132 58 C 132 32, 146 0, 164 6 C 182 14, 164 40, 148 64 Z" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 139 52 C 140 34, 150 14, 160 16 C 168 20, 156 38, 146 56 Z" fill="#F7B9A0"/>
  <!-- 舉起揮手的手（觀眾右側） -->
  <path d="M 148 150 C 162 146, 178 130, 184 112 C 187 103, 201 106, 200 117 C 196 142, 176 162, 154 168 Z" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 圓尾巴（觀眾右後方） -->
  <circle cx="162" cy="198" r="15" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 身體 -->
  <ellipse cx="120" cy="176" rx="40" ry="42" fill="#F6EEE6"/>
  <path d="M 159.4 168.7 C 162.1 184.8, 155.7 201, 142.9 210.4 C 130.2 219.8, 113.5 220.5, 100 212.4 Q 146.2 215.3, 159.4 168.7 Z" fill="#DCCBBE"/>
  <ellipse cx="120" cy="186" rx="24" ry="27" fill="#FFFFFF"/>
  <ellipse cx="120" cy="176" rx="40" ry="42" fill="none" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 大腳丫 -->
  <ellipse cx="103" cy="219" rx="16" ry="7" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 99 220 L 99 225 M 107 220 L 107 225" fill="none" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="137" cy="219" rx="16" ry="7" fill="#F6EEE6" stroke="#4A342A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 133 220 L 133 225 M 141 220 L 141 225" fill="none" stroke="#4A342A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
